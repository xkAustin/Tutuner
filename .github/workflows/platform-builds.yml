name: iOS and Windows Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS simulator
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-pub

  windows:
    name: Build Windows desktop
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build desktop app
        run: flutter build windows --debug --no-pub
